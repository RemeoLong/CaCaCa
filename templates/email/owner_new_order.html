<!doctype html><html><body style="margin:0;background:#f0f4f4;color:#082d3f;font-family:Arial,sans-serif"><div style="max-width:640px;margin:auto;background:white;padding:40px"><p style="letter-spacing:.12em;color:#215c49;font-size:12px">NEW PAID ORDER</p><h1 style="font-family:Georgia,serif;font-weight:normal">{{ order.number }}</h1><p><strong>{{ order.name }}</strong><br>{{ order.email }}<br>${{ order.total }} {{ order.currency }}</p>{% for line in order.items.all %}<p style="border-top:1px solid #d6e0e1;padding-top:16px"><strong>{{ line.name }}</strong><br>{{ line.rod_id }}{% if line.serial_number %} · Serial {{ line.serial_number }}{% endif %}</p>{% endfor %}<p><a href="{{ site_url }}{% url 'owner_order' order.pk %}" style="display:inline-block;background:#082d3f;color:white;padding:14px 20px;text-decoration:none">Open order and pack it</a></p></div></body></html>
