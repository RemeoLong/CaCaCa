name: cacaca
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: cacaca
      POSTGRES_USER: cacaca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cacaca -d cacaca"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  database:
